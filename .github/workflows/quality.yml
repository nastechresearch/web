name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: test -f dist/404.html
      - name: Verify clean public source
        run: |
          forbidden="$(printf '%s%s' M anus)"
          if grep -RIn "$forbidden" --exclude-dir=node_modules --exclude-dir=dist .; then
            exit 1
          fi
