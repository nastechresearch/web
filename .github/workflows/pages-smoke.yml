name: Verify public Pages

on:
  workflow_run:
    workflows: ["Publish NasTech Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Pages propagation and verify home content
        run: |
          page="https://nastechresearch.github.io/web/"
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --location "$page" | grep -q "NasTech Agent"; then
              echo "Public Pages home verified on attempt $attempt."
              exit 0
            fi
            sleep 10
          done
          echo "Public Pages home did not return the expected NasTech page." >&2
          exit 1
